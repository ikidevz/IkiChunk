[project]
name = "ikichunk"
version = "1.0.0"
description = "Enterprise-portable Swiss-army-knife scripting toolkit for data engineering and systems automation."
readme = { file = "README.MD", content-type = "text/markdown" }
requires-python = ">=3.9"
authors = [{name = "ikidevz"}]
license = {text = "MIT"}
keywords = ["data-engineering", "partitioning", "streaming", "compression", "parallel-processing", "scripting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
parquet = ["pyarrow>=14.0"]
zstd = ["zstandard>=0.22"]
full = ["PyYAML>=6.0", "pyarrow>=14.0", "rich>=13.0", "tqdm>=4.0", "zstandard>=0.22"]

[project.urls]
Homepage = "https://github.com/yourusername/ikichunk"
Repository = "https://github.com/yourusername/ikichunk.git"
Documentation = "https://github.com/yourusername/ikichunk"
Issues = "https://github.com/yourusername/ikichunk/issues"

[project.scripts]
ikichunk = "ikichunk.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
ikichunk = ["py.typed"]
